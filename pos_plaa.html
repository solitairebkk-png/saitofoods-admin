<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob: https://kzacpqrpnoxqtbcstswp.supabase.co; connect-src https://kzacpqrpnoxqtbcstswp.supabase.co wss://kzacpqrpnoxqtbcstswp.supabase.co https://sdjgmgyghnlpqydrnllj.supabase.co wss://sdjgmgyghnlpqydrnllj.supabase.co; base-uri 'none'; form-action 'none'">
<title>Plaa-Ta-Pian POS</title>
<style>
:root{--pri:#c8102e;--pri-d:#9b0c24;--ok:#1a7f37;--bg:#f2f3f5;--card:#fff;--bd:#d8dce1;--tx:#1f2328;--mut:#6a737d;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Noto Sans Thai","Noto Sans JP",sans-serif;background:var(--bg);color:var(--tx);-webkit-user-select:none;user-select:none;overflow:hidden;}
button{font-family:inherit;font-size:16px;border:0;border-radius:10px;cursor:pointer;color:#fff;background:var(--pri);padding:0 14px;min-height:46px;}
button:active{filter:brightness(.88);}
button.sec{background:#59636e;} button.ok{background:var(--ok);} button.lt{background:#e6e8eb;color:var(--tx);}
button:disabled{opacity:.4;}
input,select{font-family:inherit;font-size:17px;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;width:100%;background:#fff;color:var(--tx);-webkit-user-select:text;user-select:text;}
.hidden{display:none !important;}

/* login */
#login{height:100%;display:flex;align-items:center;justify-content:center;}
#login .box{background:var(--card);padding:24px;border-radius:16px;width:360px;max-width:92vw;box-shadow:0 4px 18px rgba(0,0,0,.12);}
#login h1{margin:0 0 4px;font-size:22px;color:var(--pri);}
#login p{margin:0 0 14px;color:var(--mut);font-size:14px;}
#login label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px;}
#login .err{color:var(--pri);font-size:14px;min-height:20px;margin-top:8px;}
#login button{width:100%;margin-top:10px;}

/* app */
#app{height:100%;display:flex;flex-direction:column;}
#top{display:flex;align-items:center;background:var(--card);border-bottom:1px solid var(--bd);padding:6px 8px;}
#top > *{margin-right:8px;} #top > *:last-child{margin-right:0;}
#top .brand{font-weight:700;color:var(--pri);font-size:17px;white-space:nowrap;}
#q{flex:1;min-width:80px;}
#top button{min-height:42px;font-size:14px;}
#prn{display:flex;align-items:center;background:#e6e8eb;color:var(--tx);}
#prn i{display:inline-block;width:10px;height:10px;border-radius:50%;background:#b32;margin-right:6px;}
#prn.on i{background:#2a2;}
#main{flex:1;display:flex;min-height:0;}
#cats{width:128px;flex:none;overflow-y:auto;background:#e9ebee;padding:6px;-webkit-overflow-scrolling:touch;}
#cats button{display:block;width:100%;margin:0 0 6px;background:#fff;color:var(--tx);min-height:52px;font-size:14px;padding:6px;line-height:1.2;border:2px solid transparent;}
#cats button.act,#cats button.alt.act{background:var(--pri);color:#fff;border-color:var(--pri);}
#cats button .th{font-weight:700;font-size:14px;line-height:1.2;} #cats button .en{font-size:11px;line-height:1.2;margin-top:2px;color:var(--mut);} #cats button.act .en{color:#fff;opacity:.9;}
#cats button.alt{background:#d6e6fa;border-color:#b7cfee;}
#cats button.top{border-color:#f0b429;font-weight:700;}
#cats button.top.act{background:var(--pri);border-color:#f0b429;}
#grid{flex:1;overflow-y:auto;padding:8px;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:min-content;grid-gap:8px;align-content:start;-webkit-overflow-scrolling:touch;}
.p{background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--bd);cursor:pointer;display:flex;flex-direction:column;position:relative;}
.p:active{outline:3px solid var(--pri);}
.p .im{height:0;padding-bottom:64%;position:relative;overflow:hidden;background:#f3f4f6;}
.p .im img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block;}
.p .nm{padding:8px 7px 0;font-size:14px;line-height:1.25;height:3.9em;overflow:hidden;}
.p .pr{padding:2px 7px 6px;font-weight:700;color:var(--pri);font-size:15px;}
.p .pr small{font-weight:400;color:var(--mut);font-size:11px;}
.p .bd{position:absolute;top:4px;left:4px;background:#f0b429;color:#000;font-size:11px;border-radius:6px;padding:1px 5px;}
.p .bd.lo{background:#f0b429;color:#000;left:auto;right:4px;} .p .bd.z{background:#6a737d;color:#fff;left:auto;right:4px;}
#grid.c2{grid-template-columns:repeat(2,1fr);} #grid.c2 .nm{font-size:17px;} #grid.c2 .pr{font-size:21px;} #grid.c2 .pr small{font-size:14px;}
#grid.c3{grid-template-columns:repeat(3,1fr);} #grid.c3 .nm{font-size:15px;} #grid.c3 .pr{font-size:18px;} #grid.c3 .pr small{font-size:12px;}
#grid.c4{grid-template-columns:repeat(4,1fr);} #grid.c4 .nm{font-size:13px;} #grid.c4 .pr{font-size:15px;}
#grid.c5{grid-template-columns:repeat(5,1fr);} #grid.c5 .nm{font-size:12px;} #grid.c5 .pr{font-size:14px;}
#grid.c6{grid-template-columns:repeat(6,1fr);} #grid.c6 .nm{font-size:11px;} #grid.c6 .pr{font-size:13px;} #grid.c6 .pr small{font-size:10px;}
#empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:40px 0;}
#cart{width:312px;flex:none;background:var(--card);border-left:1px solid var(--bd);display:flex;flex-direction:column;}
#lines{position:relative;flex:1;overflow-y:auto;padding:8px;background:#e4e6ea;-webkit-overflow-scrolling:touch;}
.paper{background:#fff;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.2);padding:10px 8px 12px;}
.paper .hd{text-align:center;} .paper .hd img{width:150px;height:auto;display:block;margin:0 auto 2px;} .paper .hd div{font-size:11px;color:var(--mut);}
.paper .dash{border-top:1px dashed #9aa0a8;margin:8px 0 2px;}
.paper .ptot{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:17px;padding:8px 0 4px;border-top:2px solid var(--tx);margin-top:4px;}
.paper .pqr{text-align:center;padding-top:6px;} .paper .pqr canvas{width:150px;height:150px;display:block;margin:0 auto;} .paper .pqr div{font-size:12px;color:var(--mut);}
.ln{border-bottom:1px solid #eceef1;padding:7px 0;}
.ln .t{font-size:14px;line-height:1.25;margin-bottom:5px;}
.ln .r{display:flex;align-items:center;}
.ln .r .sp{flex:1;text-align:right;font-weight:700;font-size:16px;}
.ln .smp{color:#7a5200;font-size:12px;font-weight:700;} .ln .qb{width:40px;min-height:40px;padding:0;font-size:22px;background:#e6e8eb;color:var(--tx);}
.ln .qn{min-width:40px;text-align:center;font-size:18px;font-weight:700;}
.ln .wg{background:#e6e8eb;color:var(--tx);min-height:40px;font-size:16px;font-weight:700;padding:0 12px;}
.ln .x{background:none;color:var(--pri);min-height:40px;width:38px;padding:0;font-size:22px;margin-left:4px;}
#cartEmpty{color:var(--mut);text-align:center;padding:40px 8px;font-size:14px;}
#foot{border-top:2px solid var(--bd);padding:8px;}
#tot{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;margin-bottom:8px;}
#tot b{font-size:30px;color:var(--pri);}
#acts2{display:flex;margin-bottom:6px;} #acts2 button{flex:1;margin-right:6px;min-height:40px;font-size:14px;background:#e6e8eb;color:var(--tx);padding:0 6px;} #acts2 button:last-child{margin-right:0;} #acts2 button.on{background:#fff3cd;color:#7a5200;font-weight:700;}
.paper .psub,.paper .pdisc{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;} .paper .pdisc{color:var(--pri);font-weight:700;}
#foot .row{display:flex;} #foot .row button{margin-right:8px;} #foot .row button:last-child{margin-right:0;}
#payBtn{flex:1;min-height:58px;font-size:22px;font-weight:700;}

/* modal */
.md{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:20;}
.mb{background:var(--card);border-radius:16px;padding:14px;max-width:96vw;max-height:96vh;overflow:auto;}
.mb h2{margin:0 0 8px;font-size:17px;}
.kp{display:grid;grid-template-columns:repeat(3,72px);grid-gap:6px;}
.kp button{min-height:46px;font-size:21px;background:#e6e8eb;color:var(--tx);padding:0;}
.disp{background:#f6f8fa;border:1px solid var(--bd);border-radius:10px;padding:8px 12px;font-size:28px;font-weight:700;text-align:right;min-height:50px;}
.sub{color:var(--mut);font-size:13px;text-align:right;min-height:18px;margin:2px 0 6px;}
.pay{display:flex;} .pay > div{margin-right:16px;} .pay > div:last-child{margin-right:0;}
.pay{align-items:flex-start;} .pay > div:first-child{min-width:240px;max-width:270px;}
.wide{display:flex;align-items:flex-start;} .wide > .kp{margin-right:14px;} .wide > .wr{min-width:260px;}
.mb h2{margin:0 0 6px;}
.seg{display:flex;margin-bottom:8px;} .seg button{flex:1;margin-right:6px;background:#e6e8eb;color:var(--tx);min-height:50px;font-size:17px;}
.seg button:last-child{margin-right:0;} .seg button.act{background:var(--pri);color:#fff;}
.quick{display:flex;flex-wrap:wrap;margin-bottom:6px;} .quick button{margin:0 6px 6px 0;min-height:44px;padding:0 12px;background:#e6e8eb;color:var(--tx);font-size:16px;}
.chg{font-size:22px;font-weight:700;margin:6px 0;} .chg.bad{color:var(--pri);} .chg.good{color:var(--ok);}
#qrbox{background:#fff;padding:6px;border:1px solid var(--bd);border-radius:10px;text-align:center;}
#qrbox canvas{display:block;margin:0 auto;}
.acts{display:flex;margin-top:10px;} .acts button{flex:1;margin-right:8px;} .acts button:last-child{margin-right:0;}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#24292f;color:#fff;padding:10px 18px;border-radius:12px;font-size:16px;z-index:40;max-width:90vw;text-align:center;}
#toast.bad{background:var(--pri);}
.set label{display:block;font-size:13px;color:var(--mut);margin:10px 0 3px;}
.set .chk{display:flex;align-items:center;margin:10px 0;font-size:15px;} .set .chk input{width:22px;height:22px;margin-right:8px;}
#gear{position:relative;} #fwd.bdg{position:absolute;top:-4px;right:-4px;background:#c8102e;color:#fff;border-radius:10px;font-size:11px;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 4px;}
.set hr{border:0;border-top:1px solid #e1e4e8;margin:12px 0 4px;}
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <h1>Plaa-Ta-Pian POS</h1>
    <p>เข้าสู่ระบบ / ログイン</p>
    <label for="em">Email</label>
    <input id="em" type="email" autocomplete="username" inputmode="email">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password">
    <div class="err" id="lerr"></div>
    <button id="lbtn">เข้าสู่ระบบ</button>
  </div>
</div>

<div id="app" class="hidden">
  <div id="top">
    <span class="brand">PLAA-TA-PIAN</span>
    <input id="q" type="search" placeholder="ค้นหาสินค้า" autocomplete="off">
    <button id="prn" class="lt"><i></i><span>เครื่องพิมพ์</span></button>
    <button id="reprint" class="lt">พิมพ์ซ้ำ</button>
    <button id="drawer" class="lt">เปิดลิ้นชัก</button>
    <button id="gear" class="lt">⚙<span id="fwd" class="hidden"></span></button>
    <button id="logout" class="sec">ออก</button>
  </div>
  <div id="main">
    <div id="cats"></div>
    <div id="grid"></div>
    <div id="cart">
      <div id="lines"></div>
      <div id="foot">
        <div id="acts2"><button id="discBtn">ส่วนลด</button><button id="smpBtn">ตัวอย่าง</button><button id="customBtn">＋ อื่นๆ</button></div>
        <div id="tot"><span>รวม</span><b id="totv">฿0</b></div>
        <div class="row">
          <button id="clear" class="lt">ล้าง</button>
          <button id="payBtn" class="ok">ชำระเงิน</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="modal" class="md hidden"><div class="mb" id="mbox"></div></div>
<div id="toast" class="hidden"></div>

    toast("Chrome\u0E19\u0E35\u0E49\u0E44\u0E21\u0E48\u0E23\u0E2D\u0E07\u0E23\u0E31\u0E1A Bluetooth", true, 5e3);
    return false;
  }
  if (prn.dev && !(prn.dev.gatt && prn.dev.gatt.connected)) {
    if (await ensurePrinter()) {
      toast("\u0E40\u0E0A\u0E37\u0E48\u0E2D\u0E21\u0E15\u0E48\u0E2D\u0E40\u0E04\u0E23\u0E37\u0E48\u0E2D\u0E07\u0E1E\u0E34\u0E21\u0E1E\u0E4C\u0E41\u0E25\u0E49\u0E27: " + (prn.dev.name || ""), false, 2500);
      return true;
    }
  }
  try {
    var dev = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: BLE_SERVICES });
    dev.addEventListener("gattserverdisconnected", function() {
      setPrnState(false);
    });
    prn.dev = dev;
    prn.ch = await findChar(dev);
    setPrnState(true);
    lsSet("plp_prn_id", dev.id || "");
    toast("\u0E40\u0E0A\u0E37\u0E48\u0E2D\u0E21\u0E15\u0E48\u0E2D\u0E40\u0E04\u0E23\u0E37\u0E48\u0E2D\u0E07\u0E1E\u0E34\u0E21\u0E1E\u0E4C\u0E41\u0E25\u0E49\u0E27: " + (dev.name || ""), false, 2500);
    return true;
  } catch (e) {
    setPrnState(false);
    if (e && e.name !== "NotFoundError") toast("\u0E40\u0E0A\u0E37\u0E48\u0E2D\u0E21\u0E15\u0E48\u0E2D\u0E44\u0E21\u0E48\u0E2A\u0E33\u0E40\u0E23\u0E47\u0E08: " + (e.message || e), true, 5e3);
    return false;
  }
}
async function ensurePrinter() {
  if (prn.dev && prn.ch && prn.dev.gatt.connected) return true;
  if (prn.dev) {
    try {
      prn.ch = await findChar(prn.dev);
      setPrnState(true);
      return true;
    } catch (e) {
      setPrnState(false);
    }
  }
  return false;
}
async function writeBytes(data) {
  var ch = prn.ch, n = Math.min(512, Math.max(20, parseInt(lsGet("plp_chunk", "100"), 10) || 100));
  var useNoResp = ch.properties.writeWithoutResponse && typeof ch.writeValueWithoutResponse === "function";
  for (var i = 0; i < data.length; i += n) {
    var part = data.slice(i, i + n);
    if (useNoResp) await ch.writeValueWithoutResponse(part);
    else await ch.writeValue(part);
  }
}
function drawerBytes() {
  return new Uint8Array([27, 64, 27, 112, parseInt(lsGet("plp_pin", "0"), 10) || 0, 25, 250]);
}
function enqueue(fn) {
  printChain = printChain.then(fn, fn);
  return printChain;
}
function openDrawer() {
  return enqueue(async function() {
    if (!await ensurePrinter()) {
      toast("\u0E22\u0E31\u0E07\u0E44\u0E21\u0E48\u0E44\u0E14\u0E49\u0E40\u0E0A\u0E37\u0E48\u0E2D\u0E21\u0E15\u0E48\u0E2D\u0E40\u0E04\u0E23\u0E37\u0E48\u0E2D\u0E07\u0E1E\u0E34\u0E21\u0E1E\u0E4C \u2014 \u0E40\u0E1B\u0E34\u0E14\u0E25\u0E34\u0E49\u0E19\u0E0A\u0E31\u0E01\u0E14\u0E49\u0E27\u0E22\u0E21\u0E37\u0E2D", true, 5e3);
      return;
    }
    try {
      await writeBytes(drawerBytes());
    } catch (e) {
      setPrnState(false);
      toast("\u0E40\u0E1B\u0E34\u0E14\u0E25\u0E34\u0E49\u0E19\u0E0A\u0E31\u0E01\u0E44\u0E21\u0E48\u0E2A\u0E33\u0E40\u0E23\u0E47\u0E08: " + (e.message || e), true, 5e3);
    }
  });
}
function printReceipt(rec, withDrawer) {
  return enqueue(async function() {
    if (!await ensurePrinter()) {
      toast('\u0E1A\u0E31\u0E19\u0E17\u0E36\u0E01\u0E41\u0E25\u0E49\u0E27 \u0E41\u0E15\u0E48\u0E22\u0E31\u0E07\u0E44\u0E21\u0E48\u0E44\u0E14\u0E49\u0E40\u0E0A\u0E37\u0E48\u0E2D\u0E21\u0E15\u0E48\u0E2D\u0E40\u0E04\u0E23\u0E37\u0E48\u0E2D\u0E07\u0E1E\u0E34\u0E21\u0E1E\u0E4C \u2014 \u0E01\u0E14 "\u0E40\u0E04\u0E23\u0E37\u0E48\u0E2D\u0E07\u0E1E\u0E34\u0E21\u0E1E\u0E4C" \u0E41\u0E25\u0E49\u0E27\u0E01\u0E14 "\u0E1E\u0E34\u0E21\u0E1E\u0E4C\u0E0B\u0E49\u0E33"', true, 8e3);
      return;
    }
    try {
      if (withDrawer) await writeBytes(drawerBytes());
      var img = drawReceipt(rec);
      var bytes = [27, 64].concat(packRaster(img, 64), [27, 100, 3]);
      await writeBytes(new Uint8Array(bytes));
    } catch (e) {
      setPrnState(false);
      toast("\u0E1E\u0E34\u0E21\u0E1E\u0E4C\u0E44\u0E21\u0E48\u0E2A\u0E33\u0E40\u0E23\u0E47\u0E08: " + (e.message || e) + ' \u2014 \u0E01\u0E14 "\u0E1E\u0E34\u0E21\u0E1E\u0E4C\u0E0B\u0E49\u0E33"', true, 8e3);
    }
  });
}

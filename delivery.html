<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Delivery">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1f6f43">
<title>Delivery Photo | Saito Foods</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --green: #1f6f43;
    --green-light: #e6f4ec;
    --red: #b71c1c;
    --red-light: #fdecea;
    --gray: #6b7280;
    --line: #e5e7eb;
    --bg: #f4f5f7;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: #111;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Thai", "Noto Sans JP", sans-serif;
    font-size: 16px; line-height: 1.45;
    padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--green); color: #fff;
    padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
    display: flex; align-items: center; gap: 10px;
  }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  header .who { font-size: 13px; opacity: .9; }
  header button {
    background: rgba(255,255,255,.2); color: #fff; border: 0; border-radius: 8px;
    padding: 8px 12px; font-size: 14px;
  }
  main { padding: 12px; max-width: 640px; margin: 0 auto; }
  .panel { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .panel h2 { font-size: 16px; margin: 0 0 10px; }
  label { display: block; font-size: 14px; color: var(--gray); margin: 10px 0 4px; }
  input[type=email], input[type=password], select {
    width: 100%; font-size: 17px; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; background: #fff;
  }
  .btn {
    display: block; width: 100%; border: 0; border-radius: 12px; padding: 14px;
    font-size: 17px; font-weight: 700; color: #fff; background: var(--green); margin-top: 12px;
  }
  .btn.secondary { background: #fff; color: var(--green); border: 2px solid var(--green); }
  .call-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  a.call-btn { display: inline-block; text-decoration: none; background: #2563eb; color: #fff; font-weight: 700; font-size: 17px; padding: 12px 18px; border-radius: 12px; }
  a.call-btn.slip, button.slip-btn { background: #7c3aed; }
  button.slip-btn { border: 0; color: #fff; font-weight: 700; font-size: 16px; padding: 12px 18px; border-radius: 12px; }
  button.slip-btn.again { background: #fff; color: #7c3aed; border: 2px solid #7c3aed; font-size: 14px; padding: 8px 12px; }
  button.slip-btn:disabled { opacity: .5; }
  .slip-ok { font-size: 14px; color: #166534; font-weight: 700; }
  .rice-box { margin-top: 10px; background: #fef3c7; border: 2px solid #f59e0b; border-radius: 12px; padding: 10px 12px; font-size: 20px; font-weight: 800; color: #78350f; }
  @keyframes deli-spin { to { transform: rotate(360deg); } }
  #refresh-btn.spin { animation: deli-spin .8s linear infinite; }
  #last-upd { font-size: 12px; color: var(--gray); text-align: right; margin: -4px 4px 4px; min-height: 16px; }
  .btn.small.undo { background: #fff; color: #b91c1c; border: 2px solid #b91c1c; margin-left: 8px; }
  .note-th { font-size: 17px; font-weight: 700; color: #1f2937; margin-top: 6px; }
  .note-orig { font-size: 12px; color: var(--gray); margin-top: 2px; }
  .btn.small { width: auto; display: inline-block; padding: 10px 14px; font-size: 14px; margin-top: 8px; }
  /* 片手操作用: 大きなボタンを左右に離して配置(押し間違い防止) */
  .btn-row { display: flex; justify-content: space-between; gap: 40px; margin-top: 14px; }
  .btn-row.row2 { margin-top: 30px; }
  .btn-row .btn { flex: 1 1 0; margin-top: 0; min-height: 92px; padding: 10px 8px; font-size: 16px; line-height: 1.3; }
  .btn-row .btn { display: flex; align-items: center; justify-content: center; text-align: center; text-decoration: none; }
  .btn-row .btn.call { background: #2563eb; }
  .btn-row .btn.slip { background: #7c3aed; }
  .btn-row .btn.slip.again { background: #f5f3ff; color: #5b21b6; border: 2px solid #7c3aed; }
  .btn-row .btn.slipok { background: #f0fdf4; color: #166534; border: 2px solid #86efac; }
  .btn-row .btn.alt { background: #fff7ed; color: #9a3412; border: 2px solid #fb923c; }
  .btn:disabled { opacity: .5; }
  .err { color: var(--red); font-size: 14px; margin-top: 8px; min-height: 18px; white-space: pre-wrap; }
  .section-title { font-size: 14px; font-weight: 700; color: var(--gray); margin: 18px 4px 8px; }
  .empty { text-align: center; color: var(--gray); padding: 28px 8px; }

  .card { background: #fff; border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); border-left: 6px solid var(--green); }
  .card.nocall { border-left-color: #6b7280; }
  .card.call { border-left-color: var(--red); }
  .card.done { border-left-color: #94a3b8; background: #fafafa; }
  .card .name { font-size: 18px; font-weight: 700; }
  .card .addr { font-size: 15px; margin-top: 2px; }
  .card .meta { font-size: 13px; color: var(--gray); margin-top: 4px; }
  .badge { display: inline-block; font-size: 13px; font-weight: 700; padding: 4px 9px; border-radius: 999px; margin-top: 8px; }
  .badge.nocall { background: #eef0f3; color: #374151; }
  .badge.call { background: var(--red-light); color: var(--red); }
  .badge.ok { background: var(--green-light); color: var(--green); }
  .badge.warn { background: #fff4d6; color: #8a5a00; }
  .note { margin-top: 8px; padding: 8px 10px; background: #fff8e1; border-radius: 8px; font-size: 14px; white-space: pre-wrap; }
  .thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .thumbs .th { position: relative; width: 84px; height: 84px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
  .thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumbs .rm {
    position: absolute; top: 2px; right: 2px; width: 26px; height: 26px; border-radius: 50%;
    background: rgba(0,0,0,.65); color: #fff; border: 0; font-size: 16px; line-height: 1; padding: 0;
  }
  .hint { font-size: 13px; color: var(--gray); margin-top: 6px; }
  .hidden { display: none !important; }
  input[type=file] { display: none; }
</style>
</head>
<body>

<!-- ログイン -->
<div id="login-view" class="hidden">
  <main>
    <div class="panel" style="margin-top:40px;">
      <h2>🚴 ถ่ายรูปส่งของ</h2>
      <label for="login-email">Email</label>
      <input id="login-email" type="email" autocomplete="username" inputmode="email">
      <label for="login-password">Password</label>
      <input id="login-password" type="password" autocomplete="current-password">
      <button class="btn" id="login-btn">เข้าสู่ระบบ</button>
      <div id="login-error" class="err"></div>
    </div>
  </main>
</div>

<!-- スタッフ選択 -->
<div id="staff-view" class="hidden">
  <main>
    <div class="panel" style="margin-top:40px;">
      <h2>คุณคือใคร?</h2>
      <label for="staff-select">พนักงาน</label>
      <select id="staff-select"></select>
      <button class="btn" id="staff-ok-btn">ตกลง</button>
      <div id="staff-error" class="err"></div>
    </div>
  </main>
</div>

<!-- メイン -->
<div id="main-view" class="hidden">
  <header>
    <h1>📷 ถ่ายรูปส่งของ</h1>
    <span class="who" id="who-label"></span>
    <button id="refresh-btn" aria-label="refresh">↻</button>
    <button id="menu-btn">⋯</button>
  </header>
  <main>
    <div id="last-upd"></div>
    <div class="section-title">รอส่งรูป (<span id="todo-count">0</span>)</div>
    <div id="todo-list"></div>
    <div class="section-title">ส่งแล้ววันนี้ (<span id="done-count">0</span>)</div>
    <div id="done-list"></div>
    <div id="main-error" class="err"></div>
  </main>
</div>

<script>
const SUPABASE_URL = 'https://sdjgmgyghnlpqydrnllj.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_GzbK9P2cp7FPFxrnyBjVug_IMCbjOpk';
// 注文管理(orders.html)とはログインの保存場所を分ける。
// 同じ保存場所を共有すると、このアプリでログアウトした時に注文管理側まで道連れでログアウトされるため。
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { storageKey: 'sb-saitofoods-delivery-auth' }
});
// 既存のメール送信GAS(orders.htmlの「個別メール送信」と同じ sendStaffEmail を使う。宛先はGAS側が注文IDから取得する)
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwhV5IKDbadgS7-nAEo8At2sc6KlFLhDUtckURVUNOUsuHZy76NZQF7LzKxRnOJ1gc/exec';

const STAFF_KEY = 'delivery-staff-id';
const PHOTO_BUCKET = 'delivery-photos';
const MAX_PHOTOS = 3;
const MAX_EDGE = 1280;      // 写真の長辺の最大px(縮小して容量とメール添付サイズを抑える)
const JPEG_QUALITY = 0.8;
// 一覧に出すのは、そのスタッフが今日(バンコク時間)出発した配送の注文すべて。翌日以降は出ない。

let currentStaff = null;    // { id, name }
let staffRows = [];
const staged = {};          // orderId -> [{ blob, url }] 送信前の写真
const busy = {};            // orderId -> true(送信処理中)
let loading = false;
const orderCache = {};      // orderId -> 直近に読み込んだ注文(確認ダイアログにお客様名を出すため)

// 完了前の確認。「どのお客様か」を必ず画面に出して、反射的にOKを押しても気づけるようにする
function confirmDone(orderId, question) {
  const o = orderCache[orderId];
  const who = o ? `${customerLabel(o)}\n${addressLabel(o)}` : '';
  return confirm(`${who}\n\n${question}`);
}
function escapeHtml(v) {
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
const $ = (id) => document.getElementById(id);
function show(view) {
  ['login-view', 'staff-view', 'main-view'].forEach(v => $(v).classList.toggle('hidden', v !== view));
}

// ---------------- 認証 ----------------
// 配送スタッフ専用(driver)・スタッフ・管理者のアカウントだけが使える(判定はDB側の delivery_app_allowed)
// 戻り値: true=使える / false=権限なし / null=通信エラーなどで確認できなかった
async function checkStaffRole() {
  const { data, error } = await supabaseClient.rpc('delivery_app_allowed');
  if (error) return null;
  return data === true;
}

async function login() {
  $('login-error').textContent = '';
  const email = $('login-email').value.trim();
  const password = $('login-password').value;
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error) { $('login-error').textContent = 'เข้าสู่ระบบไม่สำเร็จ: ' + error.message; return; }
  if ((await checkStaffRole()) !== true) {
    $('login-error').textContent = 'บัญชีนี้ไม่มีสิทธิ์';
    await supabaseClient.auth.signOut({ scope: 'local' });
    return;
  }
  await afterLogin();
}

async function logout() {
  if (!confirm('ออกจากระบบหรือไม่?')) return;
  localStorage.removeItem(STAFF_KEY);
  await supabaseClient.auth.signOut({ scope: 'local' });
  location.reload();
}

async function loadStaffRows() {
  const { data, error } = await supabaseClient.rpc('delivery_app_staff_list');
  if (error) throw error;
  staffRows = data || [];
}

async function afterLogin() {
  await loadStaffRows();
  const savedId = localStorage.getItem(STAFF_KEY);
  const saved = staffRows.find(s => s.id === savedId);
  if (saved) { currentStaff = saved; enterMain(); return; }
  $('staff-select').innerHTML = '<option value="">-- เลือกชื่อ --</option>' +
    staffRows.map(s => `<option value="${escapeHtml(s.id)}">${escapeHtml(s.name)}</option>`).join('');
  show('staff-view');
}

function chooseStaff() {
  const id = $('staff-select').value;
  const row = staffRows.find(s => s.id === id);
  if (!row) { $('staff-error').textContent = 'กรุณาเลือกชื่อ'; return; }
  localStorage.setItem(STAFF_KEY, row.id);
  currentStaff = row;
  enterMain();
}

function changeStaff() {
  localStorage.removeItem(STAFF_KEY);
  currentStaff = null;
  afterLogin();
}

function openMenu() {
  const act = prompt('1 = เปลี่ยนชื่อพนักงาน\n2 = ออกจากระบบ\n(พิมพ์ 1 หรือ 2)');
  if (act === '1') changeStaff();
  else if (act === '2') logout();
}

// ---------------- 注文の読み込み ----------------
function startOfTodayBangkokIso() {
  // バンコク(UTC+7)の今日0:00をISOにする
  const now = new Date();
  const bkk = new Date(now.getTime() + 7 * 3600 * 1000);
  const y = bkk.getUTCFullYear(), m = bkk.getUTCMonth(), d = bkk.getUTCDate();
  return new Date(Date.UTC(y, m, d) - 7 * 3600 * 1000).toISOString();
}

async function loadOrders() {
  if (!currentStaff || loading) return;
  loading = true;
  const t0 = Date.now();
  $('refresh-btn').classList.add('spin');
  $('main-error').textContent = '';
  try {
    const { data, error } = await supabaseClient.rpc('delivery_app_orders', { p_staff_id: currentStaff.id });
    if (error) throw error;
    const all = data || [];
    all.forEach(o => { orderCache[o.id] = o; });
    // 別の端末で完了された注文の、こちらに残っている撮影済み写真を捨てる
    const liveIds = new Set(all.filter(o => !o.delivered_at).map(o => o.id));
    Object.keys(staged).forEach(id => { if (!liveIds.has(id) && !busy[id]) { (staged[id] || []).forEach(p => URL.revokeObjectURL(p.url)); delete staged[id]; } });
    renderTodo(all.filter(o => !o.delivered_at)
      .sort((a, b) => (slotKey(a) - slotKey(b)) || (new Date(a.departed_at) - new Date(b.departed_at))));
    renderDone(all.filter(o => o.delivered_at)
      .sort((a, b) => new Date(b.delivered_at) - new Date(a.delivered_at)));
  } catch (e) {
    $('main-error').textContent = 'โหลดไม่สำเร็จ: ' + (e.message || e);
  } finally {
    loading = false;
    // 更新が一瞬で終わって「何も起きていない」ように見えないよう、最低0.7秒は回して、更新時刻を出す
    const wait = Math.max(0, 700 - (Date.now() - t0));
    setTimeout(() => {
      $('refresh-btn').classList.remove('spin');
      $('last-upd').textContent = 'อัปเดตล่าสุด ' + fmtTimeBkk(new Date().toISOString());
    }, wait);
  }
}

// ---------------- 表示 ----------------
function customerLabel(o) {
  if (o.is_wholesale) return '🏢 ' + (o.wholesale_restaurant_name || 'Wholesale');
  const c = o.customers;
  return c ? `${c.family_name || ''} ${c.first_name || ''}`.trim() : '—';
}
function addressLabel(o) {
  const c = o.customers || {};
  const condo = o.condo_name || c.condo_name || '';
  const addr = [c.address1, c.address2].filter(Boolean).join(' ');
  return [condo ? '🏢 ' + condo : '', addr].filter(Boolean).join(' / ');
}
// 配達時間帯の並び順: 朝(Morning/เช้า) → "13:00-15:00" など開始時刻の早い順 → 時間指定なし(最後)
function slotKey(o) {
  const s = String(o.delivery_time_slot || '');
  const m = s.match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);
  if (m) return (+m[1]) * 60 + (+m[2]) + (+m[3] * 60 + +m[4]) / 10000;
  if (/morning|เช้า/i.test(s)) return 0;
  return 99999;
}
// QR送金画面(スリップ)の撮影。現金払いには出さない。お客様が既にスリップを上げている注文は撮影不要。
function slipHtml(o) {
  if (o.payment_method === 'cash') return '';
  const id = escapeHtml(o.id);
  const dis = busy['slip-' + o.id] ? 'disabled' : '';
  const input = `<input type="file" accept="image/*" capture="environment" id="slipfile-${id}" onchange="uploadSlip('${id}', this)">`;
  if (o.slip_state === 'customer') return '<div class="call-row"><span class="slip-ok">✅ ลูกค้าส่งสลิปแล้ว</span></div>';
  if (o.slip_state === 'staff') return `<div class="call-row"><span class="slip-ok">✅ ถ่ายสลิปแล้ว</span>${input}<button class="slip-btn again" ${dis} onclick="document.getElementById('slipfile-${id}').click()">📸 ถ่ายใหม่</button></div>`;
  return `<div class="call-row">${input}<button class="slip-btn" ${dis} onclick="document.getElementById('slipfile-${id}').click()">📸 ถ่ายสลิปโอนเงิน</button></div>`;
}
async function uploadSlip(orderId, input) {
  pickerUntil = 0;
  const file = input.files && input.files[0];
  input.value = '';
  if (!file || busy['slip-' + orderId]) return;
  busy['slip-' + orderId] = true;
  $('main-error').textContent = '';
  let path = null;
  try {
    const blob = await shrinkImage(file);
    path = orderId + '/' + Date.now() + '.jpg';
    const up = await supabaseClient.storage.from('walkin-slips').upload(path, blob, { contentType: 'image/jpeg', upsert: false, cacheControl: '3600' });
    if (up.error) throw up.error;
    const { data: oldPath, error } = await supabaseClient.rpc('delivery_app_set_slip', { p_order_id: orderId, p_slip: 'storage:walkin-slips/' + path });
    if (error) throw error;
    if (oldPath) supabaseClient.storage.from('walkin-slips').remove([oldPath]);
    alert('✅ บันทึกสลิปแล้ว');
  } catch (e) {
    if (path) supabaseClient.storage.from('walkin-slips').remove([path]);
    const m = String((e && e.message) || e);
    $('main-error').textContent = m.includes('CUSTOMER_SLIP_EXISTS') ? 'ลูกค้าส่งสลิปไว้แล้ว' : 'บันทึกสลิปไม่สำเร็จ: ' + m;
  } finally {
    delete busy['slip-' + orderId];
    await loadOrders();
  }
}
// 別袋で持って行くお米の数量(お米の注文が無ければ何も出さない)
const RICE_LABELS = [['1kg', '1 กก.'], ['2kg', '2 กก.'], ['5kg', '5 กก.'], ['niigata', 'Niigata'], ['nuka', 'Nuka']];
function riceHtml(o) {
  const r = o.rice;
  if (!r) return '';
  const parts = RICE_LABELS.filter(([k]) => Number(r[k]) > 0).map(([k, label]) => `${label} × ${Number(r[k])}`);
  if (!parts.length) return '';
  return `<div class="rice-box">🍚 ข้าว: ${escapeHtml(parts.join('  /  '))}</div>`;
}
// 1段目左: 電話(番号が無ければ空欄)。2つ目の番号がある場合は、1段目の下に小さく出す
function callCell(o) {
  const t = telLinks(o);
  if (!t.length) return '<span style="flex:1 1 0"></span>';
  return `<a class="btn call" href="${escapeHtml(t[0].href)}"><span>📞 โทร<br>${escapeHtml(t[0].raw)}</span></a>`;
}
function callExtra(o) {
  const t = telLinks(o);
  if (t.length < 2) return '';
  return `<div class="call-row"><a class="call-btn" href="${escapeHtml(t[1].href)}">📞 โทร ${escapeHtml(t[1].raw)}</a></div>`;
}
// 2段目左: QR送金スリップ撮影(現金払いは空欄。お客様が既に上げている場合は表示のみ)
function slipCell(o) {
  if (o.payment_method === 'cash') return '<span style="flex:1 1 0"></span>';
  const id = escapeHtml(o.id);
  const dis = busy['slip-' + o.id] ? 'disabled' : '';
  const input = `<input type="file" accept="image/*" capture="environment" id="slipfile-${id}" onchange="uploadSlip('${id}', this)">`;
  if (o.slip_state === 'customer') return '<div class="btn slipok">✅ ลูกค้าส่งสลิปแล้ว</div>';
  const label = o.slip_state === 'staff' ? '<span>✅ ถ่ายสลิปแล้ว<br>(ถ่ายใหม่)</span>' : '<span>📸 ถ่ายสลิป<br>โอนเงิน</span>';
  return `${input}<button class="btn slip ${o.slip_state === 'staff' ? 'again' : ''}" ${dis} onclick="document.getElementById('slipfile-${id}').click()">${label}</button>`;
}
function telLinks(o) {
  const c = o.customers || {};
  return [c.tel1, c.tel2].map(t => String(t || '').trim()).filter(t => t)
    .map(t => ({ raw: t, href: 'tel:' + t.replace(/[^0-9+]/g, '') }))
    .filter(t => t.href.length > 7);
}

// お客様コメントのタイ語翻訳(タイ語を含まないものだけGASに送る。結果は端末に保存して再利用)
const trCache = (() => { try { return JSON.parse(localStorage.getItem('deliTr') || '{}'); } catch (e) { return {}; } })();
function saveTrCache() { try { const k = Object.keys(trCache); if (k.length > 300) k.slice(0, 100).forEach(x => delete trCache[x]); localStorage.setItem('deliTr', JSON.stringify(trCache)); } catch (e) {} }
function showTr(orderId, th) {
  document.querySelectorAll('[data-tr="' + orderId + '"]').forEach(el => { el.textContent = th ? '🇹🇭 ' + th : ''; });
}
async function translateNotes(list) {
  const need = [];
  list.forEach(o => {
    const c = (o.comment || '').trim();
    if (!c || /[ก-๙]/.test(c)) return;
    if (trCache[c]) showTr(o.id, trCache[c]); else need.push({ id: o.id, c });
  });
  if (!need.length) return;
  try {
    const uniq = [...new Set(need.map(n => n.c))];
    const { data: sess } = await supabaseClient.auth.getSession();
    const access_token = sess && sess.session ? sess.session.access_token : '';
    const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'translateToThai', access_token, texts: uniq }) });
    const json = await res.json();
    if (json.status !== 'ok') return;
    uniq.forEach((c, i) => { if (json.translations[i]) trCache[c] = json.translations[i]; });
    saveTrCache();
    need.forEach(n => showTr(n.id, trCache[n.c]));
  } catch (e) { /* 翻訳に失敗しても原文は表示されているので何もしない */ }
}

// 端末のカメラ画像を長辺MAX_EDGEのJPEGに縮小する(iPhoneのHEIC/回転情報もここで吸収される)
async function shrinkImage(file) {
  let bitmap;
  try {
    bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });
  } catch (e) {
    bitmap = await new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error('cannot read image'));
      img.src = URL.createObjectURL(file);
    });
  }
  const w = bitmap.width, h = bitmap.height;
  const scale = Math.min(1, MAX_EDGE / Math.max(w, h));
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(w * scale);
  canvas.height = Math.round(h * scale);
  canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  if (bitmap.close) bitmap.close();
  return await new Promise((resolve, reject) => {
    canvas.toBlob(b => b ? resolve(b) : reject(new Error('image encode failed')), 'image/jpeg', JPEG_QUALITY);
  });
}

async function onPhotoPicked(orderId, input) {
  pickerUntil = 0;
  const file = input.files && input.files[0];
  input.value = '';

  $('main-error').textContent = '';
  try {

    (staged[orderId] = staged[orderId] || []).push({ blob, url: URL.createObjectURL(blob) });
    await loadOrders();
  } catch (e) {
    $('main-error').textContent = 'อ่านรูปไม่ได้: ' + (e.message || e);

function removePhoto(orderId, idx) {
  const arr = staged[orderId] || [];
  if (arr[idx]) URL.revokeObjectURL(arr[idx].url);
  arr.splice(idx, 1);
  loadOrders();
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => { const s = String(r.result || ''); resolve(s.slice(s.indexOf(',') + 1)); };
    r.onerror = () => reject(r.error || new Error('read failed'));
    r.readAsDataURL(blob);
  });
}

async function sendDeliveryEmail(order, deliveredIso, blobs) {
  const { subject, body } = buildEmail(order, deliveredIso, blobs.length);
  const attachments = [];
  for (let i = 0; i < blobs.length; i++) {
    attachments.push({
      name: `delivery_${deliveredIso.slice(0, 10)}_${i + 1}.jpg`,
      mimeType: 'image/jpeg',
      data: await blobToBase64(blobs[i]),
    });
  }
  // ログイン中のスタッフの「通行証」(アクセストークン)を一緒に送る。GAS側でSupabaseに照会して本人確認する。
  const { data: sess } = await supabaseClient.auth.getSession();
  const access_token = sess && sess.session ? sess.session.access_token : '';
  const res = await fetch(GAS_URL, {
    method: 'POST',
    body: JSON.stringify({ action: 'sendStaffEmail', access_token, order_id: order.id, subject, body, attachments }),
  });
  const json = await res.json();
  if (json.status !== 'ok') throw new Error(json.message || 'mail failed');
}

async function submitDelivery(orderId) {
  const photos = staged[orderId] || [];
  if (!photos.length || busy[orderId]) return;
  if (!confirmDone(orderId, '✅ ส่งของแล้วใช่หรือไม่?\nระบบจะส่งรูปให้ลูกค้าทางอีเมลทันที')) return;
  busy[orderId] = true;
  $('main-error').textContent = '';
  await loadOrders();
  let uploadedPaths = [];
  try {
    const order = await fetchOrder(orderId);
    if (order.delivered_at) throw new Error('ส่งรูปของออเดอร์นี้ไปแล้ว');
    let deliveredIso = new Date().toISOString();

    // 1) 写真を保管庫へ(これが証拠になる)
    for (let i = 0; i < photos.length; i++) {
      const path = `${orderId}/${deliveredIso.replace(/[:.]/g, '-')}_${i + 1}.jpg`;
      const { error } = await supabaseClient.storage.from(PHOTO_BUCKET)
        .upload(path, photos[i].blob, { contentType: 'image/jpeg', upsert: false });
      if (error) throw new Error('อัปโหลดรูปไม่สำเร็จ: ' + error.message);
      uploadedPaths.push(path);
    }

    // 2) 注文に配達完了時刻と写真を記録(メールが失敗しても記録は残る)
    const { data: doneAt, error: updErr } = await supabaseClient.rpc('delivery_app_complete',
      { p_order_id: orderId, p_paths: uploadedPaths, p_handed_over: false });
    if (updErr) throw new Error(String(updErr.message).includes('ORDER_NOT_AVAILABLE') ? 'ออเดอร์นี้ถูกปิดงานไปแล้ว (อาจเป็นอีกเครื่องหนึ่ง) รูปที่ถ่ายไม่ได้ถูกบันทึก' : 'บันทึกไม่สำเร็จ: ' + updErr.message + '\nกรุณาแจ้งแคชเชียร์');
    if (doneAt) deliveredIso = new Date(doneAt).toISOString();

    // 3) お客様へ写真つきメール(メールアドレスがある場合のみ)
    let mailMsg = '';
    if (order.has_email) {
      try {
        await sendDeliveryEmail(order, deliveredIso, photos.map(p => p.blob));
        await supabaseClient.rpc('delivery_app_mark_email_sent', { p_order_id: orderId });
      } catch (e) {
        mailMsg = 'บันทึกรูปแล้ว แต่ส่งอีเมลไม่สำเร็จ กดส่งอีกครั้งในรายการ "ส่งแล้ววันนี้"\nPhoto saved, but the email failed. Use "Resend email" in the Done list.\n(' + (e.message || e) + ')';
      }
    }

    photos.forEach(p => URL.revokeObjectURL(p.url));
    delete staged[orderId];
    if (mailMsg) $('main-error').textContent = mailMsg;
  } catch (e) {
    $('main-error').textContent = e.message || String(e);
    // 途中で失敗した場合、アップロード済みの写真が注文に紐付いていなければ掃除する
    if (uploadedPaths.length) {
      try {
        const o = await fetchOrder(orderId);
        if (!o.delivered_at) await supabaseClient.storage.from(PHOTO_BUCKET).remove(uploadedPaths);
      } catch (_) { /* 掃除に失敗しても業務には影響しない */ }
    }
  } finally {
    delete busy[orderId];
    await loadOrders();
  }
}

// 記録済み写真を保管庫から取り直してメールだけ再送する
async function resendEmail(orderId) {
  if (busy[orderId]) return;
  busy[orderId] = true;
  $('main-error').textContent = '';
  await loadOrders();
  try {
    const order = await fetchOrder(orderId);
    if (!order.delivered_at || !(order.delivery_photo_paths || []).length) throw new Error('ไม่พบรูป');
    const blobs = [];
    for (const path of order.delivery_photo_paths) {
      const { data, error } = await supabaseClient.storage.from(PHOTO_BUCKET).download(path);
      if (error) throw new Error('ดาวน์โหลดรูปไม่สำเร็จ: ' + error.message);
      blobs.push(data);
    }
    await sendDeliveryEmail(order, order.delivered_at, blobs);
    await supabaseClient.rpc('delivery_app_mark_email_sent', { p_order_id: orderId });
  } catch (e) {
    $('main-error').textContent = 'ส่งอีเมลไม่สำเร็จ: ' + (e.message || e);
  } finally {
    delete busy[orderId];
    await loadOrders();
  }
}

// ---------------- 起動 ----------------
function enterMain() {
  $('who-label').textContent = currentStaff.name;
  show('main-view');
  loadOrders();
}

$('login-btn').addEventListener('click', login);
$('login-password').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
$('staff-ok-btn').addEventListener('click', chooseStaff);
$('refresh-btn').addEventListener('click', loadOrders);
$('menu-btn').addEventListener('click', openMenu);
document.addEventListener('visibilitychange', () => { if (!document.hidden && currentStaff) loadOrders(); });
// 2台で1つの一覧を共有するので、相手の完了が早く反映されるよう15秒ごとに更新する。
// ただしカメラ(写真選択)を開いている間は、画面を作り直すと撮った写真が消えることがあるので更新しない(最大90秒)。
let pickerUntil = 0;
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('button');
  if (b && /\.click\(\)/.test(b.getAttribute('onclick') || '')) pickerUntil = Date.now() + 90000;
}, true);
setInterval(() => { if (!document.hidden && currentStaff && Date.now() > pickerUntil) loadOrders(); }, 15000);

(async function init() {
  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      // 電波が弱い朝などに一瞬失敗しても、ログイン画面に戻さない(最大3回やり直す)
      let ok = null;
      for (let i = 0; i < 3 && ok === null; i++) {
        ok = await checkStaffRole();
        if (ok === null) await new Promise(r => setTimeout(r, 1500));
      }
      if (ok === true) { await afterLogin(); return; }
      if (ok === null) { show('login-view'); $('login-error').textContent = 'ไม่มีสัญญาณอินเทอร์เน็ต กรุณาเปิดแอปใหม่อีกครั้ง'; return; }
    }
  } catch (e) { /* ログイン画面へ */ }
  show('login-view');
})();
</script>

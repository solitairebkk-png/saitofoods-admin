<style>
  :root {
    --green: #1f6f43;
    --green-light: #e6f4ec;
    --red: #b71c1c;
    --red-light: #fdecea;
    --gray: #6b7280;
    --line: #e5e7eb;
    --bg: #f4f5f7;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: #111;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Thai", "Noto Sans JP", sans-serif;

  .office-call { display: flex; gap: 8px; padding: 8px 12px; background: #fff; border-bottom: 1px solid var(--line); box-shadow: 0 2px 6px rgba(0,0,0,.08); }
  .office-call a { display: flex; align-items: center; justify-content: center; text-decoration: none; border-radius: 10px; font-weight: 700; line-height: 1.2; text-align: center; }

  .office-call a.sub { flex: 1 1 0; background: #fff; color: #2563eb; border: 2px solid #2563eb; font-size: 13px; padding: 7px 4px; flex-direction: column; }
  /* お客様の住所へのナビ起動(Googleマップ)。住所のすぐ下に小さく出す */

  /* メモ(お客様メモ=ずっと残る / 注文メモ=その1件だけ)。編集ボタンは行の左端 */
  .memo { margin-top: 10px; padding: 8px 10px; border-radius: 10px; font-size: 14px; }
  .memo.cust { background: #fff8e1; border: 1px solid #f5d98b; }
  .memo.ord { background: #eef4ff; border: 1px solid #c7d7fb; }
  .memo-title { font-size: 12px; font-weight: 700; color: #4b5563; margin-bottom: 4px; }
  .memo-title small { font-weight: 500; opacity: .8; }
  .memo-row { display: flex; align-items: flex-start; gap: 8px; }
  .memo-edit { flex-shrink: 0; border: 1px solid #cbd5e1; background: #fff; color: #374151; border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: 700; }

  .memo-btns { display: flex; gap: 8px; }

  .office-call a.sub small { font-size: 10px; font-weight: 600; opacity: .8; }

  .thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumbs .rm {
    position: absolute; top: 2px; right: 2px; width: 26px; height: 26px; border-radius: 50%;

  .tab.active { background: var(--green); border-color: var(--green); color: #fff; }
  .searchbar { margin: 12px 0 0; }
  .searchbar input { width: 100%; box-sizing: border-box; font-size: 16px; padding: 12px 14px; border: 2px solid #d1d5db; border-radius: 12px; background: #fff; }
  #search-info { font-size: 13px; color: #6b7280; margin: 4px 4px 0; min-height: 0; }
  .card.nomatch { display: none !important; }
  .navbtns { position: fixed; right: 8px; bottom: calc(10px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; z-index: 20; opacity: .6; }
  .navbtns button { width: 44px; height: 44px; border-radius: 50%; border: 0; background: #1f6b3c; color: #fff; font-size: 18px; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  .navbtns button:active { transform: scale(.94); }
</style>

<script>
const SUPABASE_URL = 'https://sdjgmgyghnlpqydrnllj.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_GzbK9P2cp7FPFxrnyBjVug_IMCbjOpk';
// 注文管理(orders.html)とはログインの保存場所を分ける。
// 同じ保存場所を共有すると、このアプリでログアウトした時に注文管理側まで道連れでログアウトされるため。
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { storageKey: 'sb-saitofoods-delivery-auth' }
});
// 既存のメール送信GAS(orders.htmlの「個別メール送信」と同じ sendStaffEmail を使う。宛先はGAS側が注文IDから取得する)
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwhV5IKDbadgS7-nAEo8At2sc6KlFLhDUtckURVUNOUsuHZy76NZQF7LzKxRnOJ1gc/exec';

const STAFF_KEY = 'delivery-staff-id';
const PHOTO_BUCKET = 'delivery-photos';
const MAX_PHOTOS = 3;
const MAX_EDGE = 1280;      // 写真の長辺の最大px(縮小して容量とメール添付サイズを抑える)
const JPEG_QUALITY = 0.8;
// 一覧に出すのは、そのスタッフが今日(バンコク時間)出発した配送の注文すべて。翌日以降は出ない。

let currentStaff = null;    // { id, name }
let staffRows = [];
const staged = {};          // orderId -> [{ blob, url }] 送信前の写真
const busy = {};            // orderId -> true(送信処理中)
let loading = false;
const orderCache = {};      // orderId -> 直近に読み込んだ注文(確認ダイアログにお客様名を出すため)

// 完了前の確認。「どのお客様か」を必ず画面に出して、反射的にOKを押しても気づけるようにする
function confirmDone(orderId, question) {
  const o = orderCache[orderId];
  const who = o ? `${customerLabel(o)}\n${addressLabel(o)}` : '';
  return confirm(`${who}\n\n${question}`);
}
// 位置は「写真を選んだ時・画面を開いた時」にバックグラウンドで取り、結果をキャッシュしておく。
// 完了ボタンはキャッシュを即座に読むだけで、GPSの応答は絶対に待たない(取れなければ位置なしで完了)。
let lastFix = null; // {lat,lng,acc,t}
let fixInFlight = false;
function refreshLocation() {
  try {
    if (!navigator.geolocation || fixInFlight) return;
    fixInFlight = true;
    setTimeout(() => { fixInFlight = false; }, 12000);
    navigator.geolocation.getCurrentPosition(
      pos => {
        fixInFlight = false;
        lastFix = { lat: pos.coords.latitude, lng: pos.coords.longitude,
          acc: Number.isFinite(pos.coords.accuracy) ? Math.round(pos.coords.accuracy) : null, t: Date.now() };
      },
      () => { fixInFlight = false; },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 });
  } catch (_) { fixInFlight = false; }
}
function getCompletionLocation() {
  refreshLocation(); // 次回用に更新を開始(待たない)
  if (lastFix && Date.now() - lastFix.t < 15 * 60 * 1000) return Promise.resolve(lastFix);
  return Promise.resolve(null);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshLocation(); });
function escapeHtml(v) {
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
const $ = (id) => document.getElementById(id);
function show(view) {
  ['login-view', 'staff-view', 'main-view'].forEach(v => $(v).classList.toggle('hidden', v !== view));
}

// ---------------- 認証 ----------------
// 配送スタッフ専用(driver)・スタッフ・管理者のアカウントだけが使える(判定はDB側の delivery_app_allowed)
// 戻り値: true=使える / false=権限なし / null=通信エラーなどで確認できなかった
async function checkStaffRole() {
  const { data, error } = await supabaseClient.rpc('delivery_app_allowed');
  if (error) return null;
  return data === true;
}

async function login() {
  $('login-error').textContent = '';
  const email = $('login-email').value.trim();
  const password = $('login-password').value;
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error) { $('login-error').textContent = 'เข้าสู่ระบบไม่สำเร็จ: ' + error.message; return; }
  if ((await checkStaffRole()) !== true) {
    $('login-error').textContent = 'บัญชีนี้ไม่มีสิทธิ์';
    await supabaseClient.auth.signOut({ scope: 'local' });
    return;
  }
  await afterLogin();
}

async function logout() {
  if (!confirm('ออกจากระบบหรือไม่?')) return;
  localStorage.removeItem(STAFF_KEY);
  await supabaseClient.auth.signOut({ scope: 'local' });
  location.reload();
}

async function loadStaffRows() {
  const { data, error } = await supabaseClient.rpc('delivery_app_staff_list');
  if (error) throw error;
  staffRows = data || [];
}

async function afterLogin() {
  await loadStaffRows();
  const savedId = localStorage.getItem(STAFF_KEY);
  const saved = staffRows.find(s => s.id === savedId);
  if (saved) { currentStaff = saved; enterMain(); return; }
  $('staff-select').innerHTML = '<option value="">-- เลือกชื่อ --</option>' +
    staffRows.map(s => `<option value="${escapeHtml(s.id)}">${escapeHtml(s.name)}</option>`).join('');
  show('staff-view');
}

function chooseStaff() {
  const id = $('staff-select').value;
  const row = staffRows.find(s => s.id === id);
  if (!row) { $('staff-error').textContent = 'กรุณาเลือกชื่อ'; return; }
  localStorage.setItem(STAFF_KEY, row.id);
  currentStaff = row;
  enterMain();
}

function changeStaff() {
  localStorage.removeItem(STAFF_KEY);
  currentStaff = null;
  afterLogin();
}

function openMenu() {
  const act = prompt('1 = เปลี่ยนชื่อพนักงาน\n2 = ออกจากระบบ\n(พิมพ์ 1 หรือ 2)');
  if (act === '1') changeStaff();
  else if (act === '2') logout();
}

// ---------------- 注文の読み込み ----------------
function startOfTodayBangkokIso() {
  // バンコク(UTC+7)の今日0:00をISOにする
  const now = new Date();
  const bkk = new Date(now.getTime() + 7 * 3600 * 1000);
  const y = bkk.getUTCFullYear(), m = bkk.getUTCMonth(), d = bkk.getUTCDate();
  return new Date(Date.UTC(y, m, d) - 7 * 3600 * 1000).toISOString();
}

async function loadOrders() {
  if (!currentStaff || loading) return;
  loading = true;
  const t0 = Date.now();
  $('refresh-btn').classList.add('spin');
  $('main-error').textContent = '';
  try {
    const { data, error } = await supabaseClient.rpc('delivery_app_orders', { p_staff_id: currentStaff.id });
    if (error) throw error;
    const all = data || [];
    Object.keys(orderCache).forEach(k => delete orderCache[k]);   // 古い注文が残らないよう入れ替える(メモ編集時の再描画にも使うため)
    all.forEach(o => { orderCache[o.id] = o; });
    // 別の端末で完了された注文の、こちらに残っている撮影済み写真を捨てる
    const liveIds = new Set(all.filter(o => !o.delivered_at).map(o => o.id));
    Object.keys(staged).forEach(id => { if (!liveIds.has(id) && !busy[id]) { (staged[id] || []).forEach(p => URL.revokeObjectURL(p.url)); delete staged[id]; } });
    renderTodo(all.filter(o => !o.delivered_at)
      .sort((a, b) => (slotKey(a) - slotKey(b)) || (new Date(a.departed_at) - new Date(b.departed_at))));
    renderDone(all.filter(o => o.delivered_at)
      .sort((a, b) => new Date(b.delivered_at) - new Date(a.delivered_at)));
  } catch (e) {
    $('main-error').textContent = 'โหลดไม่สำเร็จ: ' + (e.message || e);
  } finally {
    loading = false;
    // 更新が一瞬で終わって「何も起きていない」ように見えないよう、最低0.7秒は回して、更新時刻を出す
    const wait = Math.max(0, 700 - (Date.now() - t0));
    setTimeout(() => {
      $('refresh-btn').classList.remove('spin');
      $('last-upd').textContent = 'อัปเดตล่าสุด ' + fmtTimeBkk(new Date().toISOString());
    }, wait);
  }
}

// ---------------- メモ ----------------
// 'c-<注文ID>'(お客様メモ) / 'o-<注文ID>'(注文メモ) が編集中。編集中は自動更新を止め、書きかけの文字は draft に残す
const memoEditing = {};
const memoDraft = {};
function fmtDateTimeBkk(iso) {
  return new Date(iso).toLocaleString('en-GB', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Bangkok' }).replace(',', '');
}
function memoRow(o, kind) {
  const isC = kind === 'c';
  const c = o.customers || {};
  const memo = isC ? c.delivery_memo : o.staff_memo;
  const by = isC ? c.delivery_memo_by : o.staff_memo_by;
  const at = isC ? c.delivery_memo_at : o.staff_memo_at;
  const key = kind + '-' + o.id;
  const id = escapeHtml(o.id);
  const title = isC ? '📌 โน้ตของลูกค้า <small>(แสดงทุกครั้งที่ส่ง)</small>' : '📝 โน้ตออเดอร์นี้';
  const cls = isC ? 'cust' : 'ord';
  if (memoEditing[key]) {
    const val = (key in memoDraft) ? memoDraft[key] : (memo || '');
    const dis = busy['memo-' + key] ? 'disabled' : '';
    return `<div class="memo ${cls}"><div class="memo-title">${title}</div>
      <textarea class="memo-ta" data-key="${escapeHtml(key)}" maxlength="500" rows="3" oninput="memoDraft['${escapeHtml(key)}']=this.value">${escapeHtml(val)}</textarea>
      <div class="memo-btns">
        <button class="btn small" ${dis} onclick="saveMemo('${id}','${kind}')">💾 บันทึก</button>
        <button class="btn small cancel" ${dis} onclick="cancelMemo('${id}','${kind}')">ยกเลิก</button>
      </div></div>`;
  }
  const body = memo
    ? `${escapeHtml(memo)}<div class="memo-by">${by ? 'โดย ' + escapeHtml(by) : ''}${at ? ' · ' + escapeHtml(fmtDateTimeBkk(at)) : ''}</div>`
    : '<span class="memo-empty">ยังไม่มีโน้ต</span>';
  return `<div class="memo ${cls}"><div class="memo-title">${title}</div>
    <div class="memo-row"><button class="memo-edit" onclick="editMemo('${id}','${kind}')">✏️ แก้ไข</button><div class="memo-body">${body}</div></div></div>`;
}
function memoHtml(o) {
  // お客様の登録が無い注文(customers が null)にはお客様メモは出さない
  return (o.customers ? memoRow(o, 'c') : '') + memoRow(o, 'o');
}
function editMemo(orderId, kind) {
  memoEditing[kind + '-' + orderId] = true;
  rerenderFromCache();
  const ta = document.querySelector('.memo-ta[data-key="' + kind + '-' + orderId + '"]');
  if (ta) ta.focus();
}
function cancelMemo(orderId, kind) {
  const key = kind + '-' + orderId;
  delete memoEditing[key]; delete memoDraft[key];
  rerenderFromCache();
}
async function saveMemo(orderId, kind) {
  const key = kind + '-' + orderId;
  if (busy['memo-' + key]) return;
  const ta = document.querySelector('.memo-ta[data-key="' + key + '"]');
  const val = ta ? ta.value : (memoDraft[key] || '');
  busy['memo-' + key] = true;
  $('main-error').textContent = '';
  try {
    const fn = kind === 'c' ? 'delivery_app_set_customer_memo' : 'delivery_app_set_order_memo';
    const { error } = await supabaseClient.rpc(fn, { p_order_id: orderId, p_staff_id: currentStaff.id, p_memo: val });
    if (error) throw error;
    delete memoEditing[key]; delete memoDraft[key];
  } catch (e) {
    const m = String((e && e.message) || e);
    $('main-error').textContent = 'บันทึกโน้ตไม่สำเร็จ: ' + (m.includes('MEMO_TOO_LONG') ? 'ยาวเกินไป (สูงสุด 500 ตัวอักษร)' : m);
  } finally {
    delete busy['memo-' + key];
    await loadOrders();
    rerenderFromCache();
  }
}
// 通信せずに、直近に読み込んだ注文で画面だけ作り直す(メモの編集開始・キャンセル用)
function rerenderFromCache() {
  const all = Object.values(orderCache);
  renderTodo(all.filter(o => !o.delivered_at)
    .sort((a, b) => (slotKey(a) - slotKey(b)) || (new Date(a.departed_at) - new Date(b.departed_at))));
  renderDone(all.filter(o => o.delivered_at)
    .sort((a, b) => new Date(b.delivered_at) - new Date(a.delivered_at)));
}
// 配達時間帯の並び順: 時間指定なし(残りやすいので最初) → 朝(Morning/เช้า) → "13:00-15:00" など開始時刻の早い順
function slotKey(o) {
  const s = String(o.delivery_time_slot || '');
  const m = s.match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);
  if (m) return (+m[1]) * 60 + (+m[2]) + (+m[3] * 60 + +m[4]) / 10000;
  if (/morning|เช้า/i.test(s)) return 0;
  return -1;
}
// QR送金画面(スリップ)の撮影。現金払いには出さない。お客様が既にスリップを上げている注文は撮影不要。
function slipHtml(o) {

async function uploadSlip(orderId, input) {
  pickerUntil = 0;
  const file = input.files && input.files[0];
  input.value = '';
  if (!file || busy['slip-' + orderId]) return;
  busy['slip-' + orderId] = true;
  $('main-error').textContent = '';
  let path = null;
  try {
    const blob = await shrinkImage(file);
    path = orderId + '/' + Date.now() + '.jpg';
    const up = await supabaseClient.storage.from('walkin-slips').upload(path, blob, { contentType: 'image/jpeg', upsert: false, cacheControl: '3600' });
    if (up.error) throw up.error;
    const { data: oldPath, error } = await supabaseClient.rpc('delivery_app_set_slip', { p_order_id: orderId, p_slip: 'storage:walkin-slips/' + path });
    if (error) throw error;
    if (oldPath) supabaseClient.storage.from('walkin-slips').remove([oldPath]);
    alert('✅ บันทึกสลิปแล้ว');
  } catch (e) {
    if (path) supabaseClient.storage.from('walkin-slips').remove([path]);
    const m = String((e && e.message) || e);
    $('main-error').textContent = m.includes('CUSTOMER_SLIP_EXISTS') ? 'ลูกค้าส่งสลิปไว้แล้ว' : 'บันทึกสลิปไม่สำเร็จ: ' + m;
  } finally {
    delete busy['slip-' + orderId];
    await loadOrders();
  }
}

function callBadge(o) {
  let main;
  if (o.delivery_leave_at_table) {

      ? '<span class="badge nocall">🔕 วางไว้ ไม่ต้องโทร</span>'
      : '<span class="badge call">📞 วางไว้ + โทรแจ้ง</span>';
  } else {
    main = '<span class="badge nocall">🚪 ส่งให้ลูกค้าโดยตรง</span>';
  }
  // 現金払い(未払い)は、不在で置いて帰った場合の確認のため目立たせる
  const cash = (o.payment_method === 'cash' && o.payment_status !== 'paid')
    ? ' <span class="badge warn">💵 เงินสด</span>' : '';
  // 振込・QR払い: 入金済みのときだけ、入金確認の時刻つきで表示(15秒ごとの自動更新で切り替わる)
  let pay = '';
  if (o.payment_method !== 'cash' && o.payment_status === 'paid') {
    let t = '';
    if (o.paid_at) {
      const tz = 'Asia/Bangkok';
      const day = d => new Date(d).toLocaleDateString('en-CA', { timeZone: tz });
      const sameDay = day(o.paid_at) === day(new Date());
      const dm = sameDay ? '' : new Date(o.paid_at).toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', timeZone: tz }) + ' ';
      t = ' ' + dm + fmtTimeBkk(o.paid_at);
    }
    pay = ` <span class="badge paid">💰 ชำระเงินแล้ว${t}</span>`;
  }
  return main + cash + pay;
}

// お客様コメントのタイ語翻訳(タイ語を含まないものだけGASに送る。結果は端末に保存して再利用)
const trCache = (() => { try { return JSON.parse(localStorage.getItem('deliTr') || '{}'); } catch (e) { return {}; } })();
function saveTrCache() { try { const k = Object.keys(trCache); if (k.length > 300) k.slice(0, 100).forEach(x => delete trCache[x]); localStorage.setItem('deliTr', JSON.stringify(trCache)); } catch (e) {} }
function showTr(orderId, th) {
  document.querySelectorAll('[data-tr="' + orderId + '"]').forEach(el => { el.textContent = th ? '🇹🇭 ' + th : ''; });
}
async function translateNotes(list) {
  const need = [];
  list.forEach(o => {
    const c = (o.comment || '').trim();
    if (!c || /[ก-๙]/.test(c)) return;
    if (trCache[c]) showTr(o.id, trCache[c]); else need.push({ id: o.id, c });
  });
  if (!need.length) return;
  try {
    const uniq = [...new Set(need.map(n => n.c))];
    const { data: sess } = await supabaseClient.auth.getSession();
    const access_token = sess && sess.session ? sess.session.access_token : '';
    const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'translateToThai', access_token, texts: uniq }) });
    const json = await res.json();
    if (json.status !== 'ok') return;
    uniq.forEach((c, i) => { if (json.translations[i]) trCache[c] = json.translations[i]; });
    saveTrCache();
    need.forEach(n => showTr(n.id, trCache[n.c]));
  } catch (e) { /* 翻訳に失敗しても原文は表示されているので何もしない */ }
}

// 完了済みの写真: ボタンを押した注文だけ保管庫から読み込む(最初から全部読むと重いため)

}
async function viewDonePhotos(orderId) {
  if (busy['ph-' + orderId] || donePhotos[orderId]) return;

// 端末のカメラ画像を長辺MAX_EDGEのJPEGに縮小する(iPhoneのHEIC/回転情報もここで吸収される)
async function shrinkImage(file) {
  let bitmap;
  try {
    bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });
  } catch (e) {
    bitmap = await new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error('cannot read image'));
      img.src = URL.createObjectURL(file);
    });
  }
  const w = bitmap.width, h = bitmap.height;
  const scale = Math.min(1, MAX_EDGE / Math.max(w, h));
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(w * scale);
  canvas.height = Math.round(h * scale);
  canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  if (bitmap.close) bitmap.close();
  return await new Promise((resolve, reject) => {
    canvas.toBlob(b => b ? resolve(b) : reject(new Error('image encode failed')), 'image/jpeg', JPEG_QUALITY);
  });
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => { const s = String(r.result || ''); resolve(s.slice(s.indexOf(',') + 1)); };
    r.onerror = () => reject(r.error || new Error('read failed'));
    r.readAsDataURL(blob);
  });
}

async function sendDeliveryEmail(order, deliveredIso, blobs) {

  const { data: sess } = await supabaseClient.auth.getSession();

    method: 'POST',

async function submitDelivery(orderId) {
  const photos = staged[orderId] || [];
  if (!photos.length || busy[orderId]) return;
  if (!confirmDone(orderId, '✅ ส่งของแล้วใช่หรือไม่?\nระบบจะส่งรูปให้ลูกค้าทางอีเมลทันที')) return;
  busy[orderId] = true;
  $('main-error').textContent = '';
  // ボタンを押した瞬間の位置を取り始める(写真のアップロードと並行して待つので、追加の待ち時間はほぼ出ない)
  const locPromise = getCompletionLocation();
  await loadOrders();
  let uploadedPaths = [];
  try {
    const order = await fetchOrder(orderId);
    if (order.delivered_at) throw new Error('ส่งรูปของออเดอร์นี้ไปแล้ว');
    let deliveredIso = new Date().toISOString();

    // 1) 写真を保管庫へ(これが証拠になる)
    for (let i = 0; i < photos.length; i++) {
      const path = `${orderId}/${deliveredIso.replace(/[:.]/g, '-')}_${i + 1}.jpg`;
      const { error } = await supabaseClient.storage.from(PHOTO_BUCKET)
        .upload(path, photos[i].blob, { contentType: 'image/jpeg', upsert: false });
      if (error) throw new Error('อัปโหลดรูปไม่สำเร็จ: ' + error.message);
      uploadedPaths.push(path);
    }

    // 2) 注文に配達完了時刻と写真を記録(メールが失敗しても記録は残る)
    const loc = await locPromise;
    const { data: doneAt, error: updErr } = await supabaseClient.rpc('delivery_app_complete',
      { p_order_id: orderId, p_paths: uploadedPaths, p_handed_over: false,
        p_lat: loc ? loc.lat : null, p_lng: loc ? loc.lng : null, p_accuracy_m: loc ? loc.acc : null });
    if (updErr) throw new Error(String(updErr.message).includes('ORDER_NOT_AVAILABLE') ? 'ออเดอร์นี้ถูกปิดงานไปแล้ว (อาจเป็นอีกเครื่องหนึ่ง) รูปที่ถ่ายไม่ได้ถูกบันทึก' : 'บันทึกไม่สำเร็จ: ' + updErr.message + '\nกรุณาแจ้งแคชเชียร์');
    if (doneAt) deliveredIso = new Date(doneAt).toISOString();

    // 3) お客様へ写真つきメール(メールアドレスがある場合のみ)
    let mailMsg = '';
    if (order.has_email) {
      try {
        await sendDeliveryEmail(order, deliveredIso, photos.map(p => p.blob));
        await supabaseClient.rpc('delivery_app_mark_email_sent', { p_order_id: orderId });
      } catch (e) {
        mailMsg = 'บันทึกรูปแล้ว แต่ส่งอีเมลไม่สำเร็จ กดส่งอีกครั้งในรายการ "ส่งแล้ววันนี้"\nPhoto saved, but the email failed. Use "Resend email" in the Done list.\n(' + (e.message || e) + ')';
      }
    }

    photos.forEach(p => URL.revokeObjectURL(p.url));
    delete staged[orderId];
    if (mailMsg) $('main-error').textContent = mailMsg;
  } catch (e) {
    $('main-error').textContent = e.message || String(e);
    // 途中で失敗した場合、アップロード済みの写真が注文に紐付いていなければ掃除する
    if (uploadedPaths.length) {
      try {
        const o = await fetchOrder(orderId);
        if (!o.delivered_at) await supabaseClient.storage.from(PHOTO_BUCKET).remove(uploadedPaths);
      } catch (_) { /* 掃除に失敗しても業務には影響しない */ }
    }
  } finally {
    delete busy[orderId];
    await loadOrders();
  }
}

// 記録済み写真を保管庫から取り直してメールだけ再送する
async function resendEmail(orderId) {
  if (busy[orderId]) return;
  busy[orderId] = true;
  $('main-error').textContent = '';
  await loadOrders();
  try {
    const order = await fetchOrder(orderId);
    if (!order.delivered_at || !(order.delivery_photo_paths || []).length) throw new Error('ไม่พบรูป');
    const blobs = [];
    for (const path of order.delivery_photo_paths) {
      const { data, error } = await supabaseClient.storage.from(PHOTO_BUCKET).download(path);
      if (error) throw new Error('ดาวน์โหลดรูปไม่สำเร็จ: ' + error.message);
      blobs.push(data);
    }
    await sendDeliveryEmail(order, order.delivered_at, blobs);
    await supabaseClient.rpc('delivery_app_mark_email_sent', { p_order_id: orderId });
  } catch (e) {
    $('main-error').textContent = 'ส่งอีเมลไม่สำเร็จ: ' + (e.message || e);
  } finally {
    delete busy[orderId];
    await loadOrders();
  }
}

// 撮影済みの写真・送信中・メモ入力中・カメラ起動中は絶対に再読み込みしない。
let appHash = null;
async function checkAppUpdate() {
  try {
    const res = await fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return;
    const text = await res.text();
    let h = 0; for (let i = 0; i < text.length; i++) h = (h * 31 + text.charCodeAt(i)) | 0;
    if (appHash === null) { appHash = h; return; }
    if (h === appHash) return;
    const working = Object.keys(staged).length || Object.keys(busy).length || Object.keys(memoEditing).length || Date.now() < pickerUntil;
    if (!working && !document.hidden) location.reload();
  } catch (_) { /* オフライン等は無視 */ }
}

function normQ(v) { return String(v || '').normalize('NFKC').toLowerCase().replace(/\s+/g, ' ').trim(); }
function applySearch() {
  const q = normQ($('search-q') ? $('search-q').value : '');
  const tokens = q ? q.split(' ') : [];
  let shown = 0, total = 0;
  ['todo-list', 'done-list'].forEach(id => {
    const list = $(id);
    list.querySelectorAll('.card').forEach(card => {
      const nm = card.querySelector('.name');
      const hay = normQ(nm ? nm.textContent : '');
      const ok = tokens.every(t => hay.includes(t));
      card.classList.toggle('nomatch', !ok);
      if (!list.classList.contains('hidden')) { total++; if (ok) shown++; }
    });
  });
  const info = $('search-info');
  if (info) info.textContent = tokens.length ? (shown ? `พบ ${shown} / ${total} รายการ` : 'ไม่พบรายการ (ลองดูอีกแท็บด้วย)') : '';
}

renderTodo = function (l) { _renderTodo(l); applySearch(); };
renderDone = function (l) { _renderDone(l); applySearch(); };

  const off = (bar ? bar.offsetHeight : 0) + 8;
  let target = null;
  if (dir > 0) target = cards.find(c => c.getBoundingClientRect().top > off + 4);
  else for (const c of cards) { if (c.getBoundingClientRect().top < off - 4) target = c; else break; }
  if (target) window.scrollTo({ top: window.scrollY + target.getBoundingClientRect().top - off, behavior: 'smooth' });
  else window.scrollTo({ top: dir > 0 ? document.documentElement.scrollHeight : 0, behavior: 'smooth' });
}

(async function init() {
  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      // 電波が弱い朝などに一瞬失敗しても、ログイン画面に戻さない(最大3回やり直す)
      let ok = null;
      for (let i = 0; i < 3 && ok === null; i++) {
        ok = await checkStaffRole();
        if (ok === null) await new Promise(r => setTimeout(r, 1500));
      }
      if (ok === true) { await afterLogin(); return; }
      if (ok === null) { show('login-view'); $('login-error').textContent = 'ไม่มีสัญญาณอินเทอร์เน็ต กรุณาเปิดแอปใหม่อีกครั้ง'; return; }
    }
  } catch (e) { /* ログイン画面へ */ }
  show('login-view');
})();
</script>

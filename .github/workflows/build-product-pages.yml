name: 商品ページの自動更新

# 毎日1回(タイ時間 朝6時)、Supabaseの公開中の商品から商品ページとサイトマップを作り直す。
# 変更があった時だけ自動でコミットする。GitHubの「Actions」タブから「Run workflow」で手動実行もできる。
on:
  schedule:
    - cron: '0 23 * * *'   # UTC 23:00 = タイ時間 翌朝6:00
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-product-pages.mjs'
      - '.github/workflows/build-product-pages.yml'

permissions:
  contents: write

concurrency:
  group: build-product-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 商品ページとサイトマップを生成
        run: node scripts/build-product-pages.mjs --sitemap
      - name: 変更があればコミット
        run: |
          git config user.name "saitofoods-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A products en/products sitemap.xml
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "商品ページを自動更新"
            git pull --rebase origin main
            git push
          fi
